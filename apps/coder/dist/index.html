<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8">
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <title>mAI Coder</title>
    <link href="./favicon.png" rel="icon" type="image/png">
    <script>
    "use strict";
    (() => {
      const COLOR_MODE_STORAGE_KEY = "mai-coder:color-mode-v1";
      const LEGACY_COLOR_MODE_STORAGE_KEY = "async:color-mode-v1";
      const INITIAL_WINDOW_THEME_STORAGE_KEY =
        "mai-coder:initial-window-theme-v1";
      const LEGACY_INITIAL_WINDOW_THEME_STORAGE_KEY =
        "async:initial-window-theme-v1";
      const INITIAL_WINDOW_THEME_QUERY_PARAM = "initialWindowTheme";
      const DEFAULTS = {
        dark: {
          accentColor: "#0169CC",
          backgroundColor: "#111111",
          foregroundColor: "#FCFCFC",
        },
        light: {
          accentColor: "#0169CC",
          backgroundColor: "#F5F5F7",
          foregroundColor: "#1D1D1F",
        },
      };

      const root = document.documentElement;

      const normalizeColorMode = (raw) =>
        raw === "light" || raw === "dark" || raw === "system" ? raw : "dark";
      const normalizeHexColor = (raw, fallback) => {
        const value = String(raw ?? "").trim();
        if (/^#[0-9a-fA-F]{6}$/.test(value)) {
          return value.toUpperCase();
        }
        if (/^#[0-9a-fA-F]{3}$/.test(value)) {
          const parts = value.slice(1).split("");
          return `#${parts.map((part) => part + part).join("")}`.toUpperCase();
        }
        return fallback.toUpperCase();
      };
      const hexToRgb = (hex) => {
        const normalized = normalizeHexColor(hex, "#000000");
        return {
          b: Number.parseInt(normalized.slice(5, 7), 16),
          g: Number.parseInt(normalized.slice(3, 5), 16),
          r: Number.parseInt(normalized.slice(1, 3), 16),
        };
      };
      const rgbToHex = ({ r, g, b }) =>
        `#${[r, g, b]
          .map((channel) =>
            Math.max(0, Math.min(255, Math.round(channel)))
              .toString(16)
              .padStart(2, "0")
          )
          .join("")}`.toUpperCase();
      const mixHex = (baseHex, overlayHex, overlayWeight) => {
        const base = hexToRgb(baseHex);
        const overlay = hexToRgb(overlayHex);
        const weight = Math.max(0, Math.min(1, overlayWeight));
        return rgbToHex({
          b: base.b * (1 - weight) + overlay.b * weight,
          g: base.g * (1 - weight) + overlay.g * weight,
          r: base.r * (1 - weight) + overlay.r * weight,
        });
      };
      const hexToRgba = (hex, alpha) => {
        const { r, g, b } = hexToRgb(hex);
        return `rgba(${r}, ${g}, ${b}, ${Math.max(0, Math.min(1, alpha))})`;
      };
      const parseThemePayload = (raw) => {
        if (!raw) {
          return null;
        }
        try {
          const parsed = JSON.parse(raw);
          return parsed && typeof parsed === "object" ? parsed : null;
        } catch {
          return null;
        }
      };
      const readThemePayload = () => {
        try {
          const params = new URLSearchParams(window.location.search);
          return (
            parseThemePayload(params.get(INITIAL_WINDOW_THEME_QUERY_PARAM)) ||
            parseThemePayload(
              window.localStorage.getItem(INITIAL_WINDOW_THEME_STORAGE_KEY)
            ) ||
            parseThemePayload(
              window.localStorage.getItem(
                LEGACY_INITIAL_WINDOW_THEME_STORAGE_KEY
              )
            )
          );
        } catch {
          return null;
        }
      };

      const payload = readThemePayload();
      let colorMode = normalizeColorMode(payload?.colorMode);
      if (!payload) {
        try {
          colorMode = normalizeColorMode(
            window.localStorage.getItem(COLOR_MODE_STORAGE_KEY) ||
              window.localStorage.getItem(LEGACY_COLOR_MODE_STORAGE_KEY)
          );
        } catch {
          colorMode = "dark";
        }
      }
      const prefersDark = window.matchMedia(
        "(prefers-color-scheme: dark)"
      ).matches;
      const scheme =
        payload?.scheme === "light" || payload?.scheme === "dark"
          ? payload.scheme
          : colorMode === "system"
            ? prefersDark
              ? "dark"
              : "light"
            : colorMode;
      const defaults = DEFAULTS[scheme];
      const ui =
        payload?.ui && typeof payload.ui === "object" ? payload.ui : {};
      const backgroundColor = normalizeHexColor(
        ui.backgroundColor,
        defaults.backgroundColor
      );
      const foregroundColor = normalizeHexColor(
        ui.foregroundColor,
        defaults.foregroundColor
      );
      const accentColor = normalizeHexColor(
        ui.accentColor,
        defaults.accentColor
      );
      const bodyBg = mixHex(
        backgroundColor,
        scheme === "dark" ? "#000000" : "#FFFFFF",
        scheme === "dark" ? 0.08 : 0.02
      );
      const splashTop = mixHex(
        backgroundColor,
        accentColor,
        scheme === "dark" ? 0.14 : 0.08
      );
      const splashBottom = mixHex(
        backgroundColor,
        scheme === "dark" ? "#000000" : "#FFFFFF",
        scheme === "dark" ? 0.16 : 0.08
      );
      const cardBg = mixHex(
        backgroundColor,
        scheme === "dark" ? "#FFFFFF" : "#FFFFFF",
        scheme === "dark" ? 0.1 : 0.62
      );
      const cardBorder = mixHex(
        backgroundColor,
        foregroundColor,
        scheme === "dark" ? 0.2 : 0.16
      );
      const subtitleColor = mixHex(
        backgroundColor,
        foregroundColor,
        scheme === "dark" ? 0.62 : 0.58
      );
      const loaderRing = mixHex(
        backgroundColor,
        foregroundColor,
        scheme === "dark" ? 0.18 : 0.12
      );
      const cardShadow =
        scheme === "dark"
          ? `0 28px 80px ${hexToRgba("#000000", 0.34)}, inset 0 1px 0 ${hexToRgba("#FFFFFF", 0.04)}`
          : `0 28px 80px ${hexToRgba("#5B6472", 0.16)}, inset 0 1px 0 ${hexToRgba("#FFFFFF", 0.72)}`;

      root.setAttribute("data-ui-style", "mac-codex");
      root.setAttribute("data-color-scheme", scheme);
      root.style.setProperty("--boot-body-bg", bodyBg);
      root.style.setProperty("--boot-body-fg", foregroundColor);
      root.style.setProperty(
        "--boot-splash-bg",
        [
          `radial-gradient(circle at top center, ${hexToRgba(accentColor, scheme === "dark" ? 0.14 : 0.1)} 0%, transparent 30%)`,
          `radial-gradient(circle at 82% 16%, ${hexToRgba(foregroundColor, scheme === "dark" ? 0.08 : 0.05)} 0%, transparent 18%)`,
          `linear-gradient(180deg, ${splashTop} 0%, ${splashBottom} 100%)`,
        ].join(", ")
      );
      root.style.setProperty(
        "--boot-card-bg",
        `linear-gradient(180deg, ${cardBg} 0%, ${mixHex(cardBg, backgroundColor, 0.22)} 100%)`
      );
      root.style.setProperty("--boot-card-border", cardBorder);
      root.style.setProperty("--boot-card-shadow", cardShadow);
      root.style.setProperty("--boot-subtitle-color", subtitleColor);
      root.style.setProperty("--boot-loader-ring", loaderRing);
      root.style.setProperty("--boot-loader-accent", accentColor);
      root.style.setProperty(
        "--boot-logo-shadow",
        `drop-shadow(0 12px 24px ${hexToRgba(accentColor, scheme === "dark" ? 0.18 : 0.12)})`
      );
    })();
    </script>
    <style>
    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      color: var(--boot-body-fg, #f4f4f5);
      background: var(--boot-body-bg, #0b0f13);
    }
    body {
      font-family:
        "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    }
    #root {
      width: 100%;
      height: 100%;
    }
    #boot-splash {
      position: fixed;
      inset: 0;
      z-index: 9999;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(
        --boot-splash-bg,
        radial-gradient(
          circle at top center,
          rgba(56, 189, 248, 0.1) 0%,
          transparent 28%
        ),
        radial-gradient(
          circle at 82% 16%,
          rgba(251, 146, 60, 0.08) 0%,
          transparent 18%
        ),
        linear-gradient(180deg, #0f1419 0%, #0a0e12 100%)
      );
      transition:
        opacity 280ms ease,
        visibility 280ms ease;
    }
    #boot-splash.is-hidden {
      visibility: hidden;
      pointer-events: none;
      opacity: 0;
    }
    .boot-splash-card {
      display: flex;
      gap: 16px;
      align-items: center;
      padding: 22px 24px;
      background: var(
        --boot-card-bg,
        linear-gradient(
          180deg,
          rgba(25, 32, 39, 0.96) 0%,
          rgba(18, 24, 30, 0.96) 100%
        )
      );
      border: 1px solid var(--boot-card-border, rgba(255, 255, 255, 0.08));
      border-radius: 20px;
      box-shadow: var(
        --boot-card-shadow,
        0 28px 80px rgba(0, 0, 0, 0.34),
        inset 0 1px 0 rgba(255, 255, 255, 0.04)
      );
    }
    .boot-splash-logo {
      flex-shrink: 0;
      width: 42px;
      height: 42px;
      filter: var(
        --boot-logo-shadow,
        drop-shadow(0 12px 24px rgba(255, 255, 255, 0.08))
      );
      animation: boot-float 1.8s ease-in-out infinite;
    }
    .boot-splash-copy {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .boot-splash-title {
      font-size: 20px;
      font-weight: 700;
      letter-spacing: -0.03em;
    }
    .boot-splash-subtitle {
      font-size: 12px;
      color: var(--boot-subtitle-color, rgba(228, 228, 231, 0.72));
    }
    .boot-splash-loader {
      width: 18px;
      height: 18px;
      margin-left: 6px;
      border: 2px solid var(--boot-loader-ring, rgba(255, 255, 255, 0.14));
      border-top-color: var(--boot-loader-accent, #67e8f9);
      border-radius: 999px;
      animation: boot-spin 0.9s linear infinite;
    }
    @keyframes boot-spin {
      from {
        transform: rotate(0deg);
      }
      to {
        transform: rotate(360deg);
      }
    }
    @keyframes boot-float {
      0%,
      100% {
        transform: translateY(0);
      }
      50% {
        transform: translateY(-2px);
      }
    }
    </style>
