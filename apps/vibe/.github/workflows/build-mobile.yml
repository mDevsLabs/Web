name: Build Mobile Apps (APK / IPA)

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      build_ios:
        description: 'Build iOS (IPA) aussi — nécessite un runner macOS'
        type: boolean
        default: true

jobs:
  build-android:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: npm ci

      - name: Lint source
        run: npm run lint

      - name: Build web app
        run: npm run build
        env:
          VITE_API_BASE: https://mai.val.run

      - name: Add Capacitor platforms
        run: |
          npm i -D @capacitor/cli
          npm i @capacitor/core @capacitor/android @capacitor/haptics
          if [ ! -d "android" ]; then
            npx cap add android || true
          fi
          npx cap sync android

      - name: Fix Android duplicate Kotlin classes
        run: |
          cat << 'EOF' >> android/app/build.gradle

          configurations.all {
              resolutionStrategy {
                  force 'org.jetbrains.kotlin:kotlin-stdlib:1.8.22'
                  force 'org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.8.22'
                  force 'org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.8.22'
              }
          }

          dependencies {
              implementation platform("org.jetbrains.kotlin:kotlin-bom:1.8.22")
              constraints {
                  implementation("org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.8.22") {
                      because("kotlin-stdlib-jdk7 is now part of kotlin-stdlib")
                  }
                  implementation("org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.8.22") {
                      because("kotlin-stdlib-jdk8 is now part of kotlin-stdlib")
                  }
              }
          }
          EOF

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Build Android APK (Release si keystore, sinon Debug)
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "🔑 Keystore détecté : compilation de l'APK Release signé..."
            echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > android/app/release.keystore
            printf "storeFile=../release.keystore\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n" \
              "$ANDROID_KEYSTORE_PASSWORD" "$ANDROID_KEY_ALIAS" "$ANDROID_KEY_PASSWORD" > android/keystore.properties
            cd android && ./gradlew assembleRelease
          else
            echo "⚙️ Aucun keystore fourni : compilation de l'APK Debug (installable sans certificat de release)..."
            cd android && ./gradlew assembleDebug
          fi

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: vibe-android-apk
          path: android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error

  build-ios:
    name: iOS IPA
    runs-on: macos-latest
    if: ${{ (github.event_name == 'workflow_dispatch' && inputs.build_ios) || github.event_name == 'push' || github.event_name == 'pull_request' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint source
        run: npm run lint

      - name: Build web app
        run: npm run build
        env:
          VITE_API_BASE: https://mai.val.run

      - name: Add Capacitor iOS platform
        run: |
          npm i -D @capacitor/cli
          npm i @capacitor/core @capacitor/ios @capacitor/haptics
          if [ ! -d "ios" ]; then
            npx cap add ios || true
          fi
          # Mettre à jour le deployment target iOS vers 15.0 pour satisfaire les specs de Capacitor
          if [ -f "ios/App/Podfile" ]; then
            sed -i '' "s/platform :ios, '[0-9.]*'/platform :ios, '15.0'/" ios/App/Podfile
          fi
          if [ -f "ios/App/App.xcodeproj/project.pbxproj" ]; then
            sed -i '' "s/IPHONEOS_DEPLOYMENT_TARGET = [0-9.]*;/IPHONEOS_DEPLOYMENT_TARGET = 15.0;/g" ios/App/App.xcodeproj/project.pbxproj
          fi
          npx cap sync ios

      - name: Build archive (non signé sans secrets Apple)
        run: |
          cd ios/App
          xcodebuild -workspace App.xcworkspace -scheme App -configuration Release -destination 'generic/platform=iOS' -archivePath App.xcarchive archive CODE_SIGNING_ALLOWED=NO CODE_SIGN_IDENTITY=""

      - name: Export unsigned IPA
        run: |
          mkdir -p Payload
          cp -r ios/App/App.xcarchive/Products/Applications/*.app Payload/
          zip -r vibe-ios-unsigned.ipa Payload

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: vibe-ios-ipa
          path: vibe-ios-unsigned.ipa
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: [build-android, build-ios]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/canary')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Read version from package.json
        id: pkg
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
          echo "📦 Version détectée : $VERSION"

      - name: Download Android APK
        uses: actions/download-artifact@v4
        with:
          name: vibe-android-apk
          path: release-assets/android

      - name: Download iOS IPA
        uses: actions/download-artifact@v4
        with:
          name: vibe-ios-ipa
          path: release-assets/ios

      - name: Prepare release assets
        run: |
          mkdir -p release-final
          # Copier et renommer les APK
          find release-assets/android -name '*.apk' | while read apk; do
            VARIANT=$(basename "$(dirname "$apk")")
            cp "$apk" "release-final/vibe-${VARIANT}-${{ steps.pkg.outputs.version }}.apk"
          done
          # Copier et renommer l'IPA
          find release-assets/ios -name '*.ipa' | while read ipa; do
            cp "$ipa" "release-final/vibe-ios-${{ steps.pkg.outputs.version }}.ipa"
          done
          echo "📁 Fichiers de release :"
          ls -lh release-final/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.pkg.outputs.tag }}
          name: "Vibe ${{ steps.pkg.outputs.version }}"
          body: |
            ## 📱 Vibe ${{ steps.pkg.outputs.version }}

            ### Téléchargements
            - **Android** : APK installable (debug ou release selon la configuration)
            - **iOS** : IPA non signé (nécessite re-signature pour installation)

            ### Notes
            - Branche : `${{ github.ref_name }}`
            - Commit : `${{ github.sha }}`
            - Build : [#${{ github.run_number }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})
          files: release-final/*
          draft: false
          prerelease: ${{ github.ref_name == 'canary' }}
          generate_release_notes: true
