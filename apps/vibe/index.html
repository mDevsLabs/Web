<!doctype html>
<html lang="fr" class="light" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="icon" type="image/png" href="/logo.png" />
    <link rel="shortcut icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.json" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Vibe — Réseau Social avec IA mAI" />
    <meta property="og:description" content="Vibe — Réseau Social nouvelle génération avec IA mAI" />
    <meta property="og:image" content="/logo.png" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Vibe — Réseau Social avec IA mAI" />
    <meta name="twitter:description" content="Vibe — Réseau Social nouvelle génération avec IA mAI" />
    <meta name="twitter:image" content="/logo.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,200..800;1,200..800&display=swap" rel="stylesheet" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#ffffff" />
    <script>
      (function() {
        try {
          var saved = localStorage.getItem('vibe_theme_preference') || 'light';
          var prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
          var isDark = saved === 'dark' || (saved === 'system' && prefersDark);
          if (isDark) {
            document.documentElement.classList.add('dark');
            document.documentElement.classList.remove('light');
            document.documentElement.setAttribute('data-theme', 'dark');
            var meta = document.querySelector('meta[name="theme-color"]');
            if (meta) meta.setAttribute('content', '#000000');
            document.documentElement.style.setProperty('--vibe-sent-bubble-bg', '#18181b');
            document.documentElement.style.setProperty('--vibe-sent-bubble-color', '#ffffff');
            document.documentElement.style.setProperty('--vibe-sent-bubble-border', '1px solid #3f3f46');
          } else {
            document.documentElement.classList.add('light');
            document.documentElement.classList.remove('dark');
            document.documentElement.setAttribute('data-theme', 'light');
            var meta = document.querySelector('meta[name="theme-color"]');
            if (meta) meta.setAttribute('content', '#ffffff');
            document.documentElement.style.setProperty('--vibe-sent-bubble-bg', '#ffffff');
            document.documentElement.style.setProperty('--vibe-sent-bubble-color', '#000000');
            document.documentElement.style.setProperty('--vibe-sent-bubble-border', '1.5px solid #000000');
          }
        } catch (e) {}
      })();
    </script>
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Vibe" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="description" content="Vibe — Réseau Social nouvelle génération avec IA mAI" />
    <title>Vibe — Réseau Social avec IA mAI</title>
  </head>
  <body class="bg-white text-black antialiased selection:bg-zinc-900 selection:text-white overscroll-none">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
