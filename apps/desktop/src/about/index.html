<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>À propos de mAI</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #ffffff;
      --card-bg: #f8fafc;
      --card-border: #e2e8f0;
      --text: #0f172a;
      --text-muted: #64748b;
      --accent: #2563eb;
      --accent-hover: #1d4ed8;
      --accent-subtle: #eff6ff;
      --accent-border: #bfdbfe;
      --success: #059669;
      --success-bg: #ecfdf5;
      --success-border: #a7f3d0;
      --warning: #d97706;
      --warning-bg: #fffbeb;
      --warning-border: #fde68a;
      --destructive: #dc2626;
      --destructive-bg: #fef2f2;
      --destructive-border: #fecaca;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-drag: none;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      height: 100vh;
      padding: 22px 24px;
      overflow: hidden;
    }

    .header {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-bottom: 16px;
    }

    .logo-img {
      width: 48px;
      height: 48px;
      border-radius: 12px;
      object-fit: cover;
      box-shadow: 0 2px 8px rgba(15, 23, 42, 0.08);
      border: 1px solid var(--card-border);
      flex-shrink: 0;
    }

    .app-title-group {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .app-name-row {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .app-name {
      font-size: 19px;
      font-weight: 700;
      letter-spacing: -0.02em;
      color: var(--text);
    }

    .badge {
      font-size: 11px;
      font-weight: 600;
      padding: 2px 8px;
      border-radius: 9999px;
      background: var(--accent-subtle);
      color: var(--accent);
      border: 1px solid var(--accent-border);
    }

    .app-desc {
      font-size: 12px;
      color: var(--text-muted);
    }

    .specs-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 8px;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 10px;
      padding: 10px 14px;
      margin-bottom: 14px;
    }

    .spec-item {
      display: flex;
      justify-content: space-between;
      font-size: 11px;
    }

    .spec-label {
      color: var(--text-muted);
    }

    .spec-val {
      font-weight: 600;
      color: var(--text);
    }

    .update-section {
      flex: 1;
      display: flex;
      flex-direction: column;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 14px 16px;
      gap: 10px;
    }

    .update-header {
      font-size: 12px;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 7px;
      color: var(--text);
    }

    .status-box {
      font-size: 12px;
      color: var(--text-muted);
      min-height: 42px;
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 10px;
      border-radius: 8px;
      background: #ffffff;
      border: 1px solid var(--card-border);
    }

    .status-icon {
      flex-shrink: 0;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    .status-text {
      flex: 1;
      line-height: 1.4;
    }

    .release-card {
      background: #ffffff;
      border: 1px solid var(--card-border);
      border-radius: 8px;
      padding: 8px 12px;
      font-size: 11px;
      display: none;
      flex-direction: column;
      gap: 3px;
    }

    .release-card.show {
      display: flex;
    }

    .release-title {
      font-weight: 600;
      color: var(--text);
    }

    .release-meta {
      font-size: 11px;
      color: var(--text-muted);
    }

    .progress-container {
      display: none;
      flex-direction: column;
      gap: 6px;
      margin-top: 4px;
    }

    .progress-container.show {
      display: flex;
    }

    .progress-bar-bg {
      width: 100%;
      height: 6px;
      background: #e2e8f0;
      border-radius: 3px;
      overflow: hidden;
    }

    .progress-bar-fill {
      height: 100%;
      width: 0%;
      background: var(--accent);
      border-radius: 3px;
      transition: width 0.2s ease;
    }

    .progress-text {
      font-size: 11px;
      color: var(--text-muted);
      display: flex;
      justify-content: space-between;
    }

    .actions {
      display: flex;
      gap: 8px;
      margin-top: auto;
    }

    button {
      flex: 1;
      padding: 8px 14px;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: all 0.15s ease;
      border: 1px solid var(--card-border);
      background: #ffffff;
      color: var(--text);
    }

    button:hover:not(:disabled) {
      background: #f1f5f9;
      border-color: #cbd5e1;
    }

    button.primary {
      background: var(--accent);
      color: #ffffff;
      border-color: var(--accent);
    }

    button.primary:hover:not(:disabled) {
      background: var(--accent-hover);
      border-color: var(--accent-hover);
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 12px;
      font-size: 11px;
      color: var(--text-muted);
    }

    .footer-link {
      color: var(--text-muted);
      text-decoration: none;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }

    .footer-link:hover {
      color: var(--accent);
    }

    .spinner {
      display: inline-block;
      width: 13px;
      height: 13px;
      border: 2px solid rgba(15, 23, 42, 0.2);
      border-top-color: var(--text);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    button.primary .spinner {
      border: 2px solid rgba(255, 255, 255, 0.3);
      border-top-color: #ffffff;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div class="header">
    <img src="./logo.png" alt="mAI" class="logo-img" id="appLogo" />
    <div class="app-title-group">
      <div class="app-name-row">
        <span class="app-name" id="appName">mAI</span>
        <span class="badge" id="appVersion">v...</span>
      </div>
      <span class="app-desc">Application officielle</span>
    </div>
  </div>

  <div class="specs-grid">
    <div class="spec-item">
      <span class="spec-label">Plateforme</span>
      <span class="spec-val" id="specPlatform">...</span>
    </div>
    <div class="spec-item">
      <span class="spec-label">Electron</span>
      <span class="spec-val" id="specElectron">...</span>
    </div>
    <div class="spec-item">
      <span class="spec-label">Chromium</span>
      <span class="spec-val" id="specChromium">...</span>
    </div>
    <div class="spec-item">
      <span class="spec-label">Node.js</span>
      <span class="spec-val" id="specNode">...</span>
    </div>
  </div>

  <div class="update-section">
    <div class="update-header">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21 12a9 9 0 0 0-9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/>
        <path d="M3 3v5h5"/>
        <path d="M3 12a9 9 0 0 0 9 9 9.75 9.75 0 0 0 6.74-2.74L21 16"/>
        <path d="M16 21h5v-5"/>
      </svg>
      <span>Mise à jour</span>
    </div>

    <div class="status-box" id="statusBox">
      <span class="status-icon" id="statusIcon">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="10"/>
          <line x1="12" y1="16" x2="12" y2="12"/>
          <line x1="12" y1="8" x2="12.01" y2="8"/>
        </svg>
      </span>
      <span class="status-text" id="statusText">Prêt à vérifier</span>
    </div>

    <div class="release-card" id="releaseCard">
      <div class="release-title" id="releaseTitle"></div>
      <div class="release-meta" id="releaseMeta"></div>
    </div>

    <div class="progress-container" id="progressContainer">
      <div class="progress-bar-bg">
        <div class="progress-bar-fill" id="progressBarFill"></div>
      </div>
      <div class="progress-text">
        <span id="progressText">Téléchargement...</span>
        <span id="progressPercent">0%</span>
      </div>
    </div>

    <div class="actions">
      <button id="btnCheck">
        <span id="checkBtnIcon">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21.5 2v6h-6M21.34 15.57a10 10 0 1 1-.57-8.38l5.67-5.19"/>
          </svg>
        </span>
        <span id="checkBtnLabel">Vérifier</span>
      </button>
      <button class="primary" id="btnDownload" style="display: none;">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
          <polyline points="7 10 12 15 17 10"/>
          <line x1="12" y1="15" x2="12" y2="3"/>
        </svg>
        <span>Télécharger</span>
      </button>
      <button class="primary" id="btnLaunch" style="display: none;">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="16 18 22 12 16 6"/>
          <polyline points="8 6 2 12 8 18"/>
        </svg>
        <span>Installer</span>
      </button>
    </div>
  </div>

  <div class="footer">
    <a class="footer-link" id="linkSite">mai-officiel.vercel.app</a>
    <a class="footer-link" id="linkGithub">GitHub</a>
  </div>

  <script>
    const appNameEl = document.getElementById("appName");
    const appVersionEl = document.getElementById("appVersion");
    const specPlatformEl = document.getElementById("specPlatform");
    const specElectronEl = document.getElementById("specElectron");
    const specChromiumEl = document.getElementById("specChromium");
    const specNodeEl = document.getElementById("specNode");

    const statusBox = document.getElementById("statusBox");
    const statusIcon = document.getElementById("statusIcon");
    const statusText = document.getElementById("statusText");

    const releaseCard = document.getElementById("releaseCard");
    const releaseTitle = document.getElementById("releaseTitle");
    const releaseMeta = document.getElementById("releaseMeta");

    const progressContainer = document.getElementById("progressContainer");
    const progressBarFill = document.getElementById("progressBarFill");
    const progressText = document.getElementById("progressText");
    const progressPercent = document.getElementById("progressPercent");

    const btnCheck = document.getElementById("btnCheck");
    const checkBtnIcon = document.getElementById("checkBtnIcon");
    const checkBtnLabel = document.getElementById("checkBtnLabel");
    const btnDownload = document.getElementById("btnDownload");
    const btnLaunch = document.getElementById("btnLaunch");

    const linkSite = document.getElementById("linkSite");
    const linkGithub = document.getElementById("linkGithub");

    let currentUpdateData = null;
    let downloadedFilePath = null;

    const ICONS = {
      info: `<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/></svg>`,
      check: `<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="var(--success)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>`,
      alert: `<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="var(--destructive)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>`,
      update: `<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>`,
      refresh: `<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21.5 2v6h-6M21.34 15.57a10 10 0 1 1-.57-8.38l5.67-5.19"/></svg>`,
    };

    function setStatus(type, message) {
      statusIcon.innerHTML = ICONS[type] || ICONS.info;
      statusText.textContent = message;
      if (type === "alert") {
        statusText.style.color = "var(--destructive)";
      } else if (type === "check") {
        statusText.style.color = "var(--success)";
      } else if (type === "update") {
        statusText.style.color = "var(--accent)";
      } else {
        statusText.style.color = "var(--text-muted)";
      }
    }

    async function init() {
      try {
        const info = await window.maiAbout.getInfo();
        appNameEl.textContent = info.appName;
        appVersionEl.textContent = `v${info.version}`;
        specPlatformEl.textContent = `${info.platform} (${info.arch})`;
        specElectronEl.textContent = `v${info.electronVersion}`;
        specChromiumEl.textContent = `v${info.chromiumVersion}`;
        specNodeEl.textContent = `v${info.nodeVersion}`;
      } catch (err) {
        console.error("Info inaccessible :", err);
      }
    }

    function formatBytes(bytes) {
      if (!bytes || bytes <= 0) return "";
      const mb = (bytes / (1024 * 1024)).toFixed(1);
      return `${mb} Mo`;
    }

    async function checkUpdates() {
      btnCheck.disabled = true;
      checkBtnIcon.innerHTML = `<span class="spinner"></span>`;
      checkBtnLabel.textContent = "Recherche...";
      setStatus("info", "Vérification sur GitHub...");
      releaseCard.classList.remove("show");
      btnDownload.style.display = "none";
      btnLaunch.style.display = "none";
      progressContainer.classList.remove("show");

      try {
        const res = await window.maiAbout.checkUpdates();
        currentUpdateData = res;

        if (res.error) {
          setStatus("alert", res.error);
        } else if (res.hasUpdate) {
          setStatus("update", "Nouvelle version disponible");
          releaseTitle.textContent = `${res.releaseName || res.latestVersion}`;
          releaseMeta.textContent = res.fileName + (res.fileSize ? ` · ${formatBytes(res.fileSize)}` : "");
          releaseCard.classList.add("show");
          btnDownload.style.display = "flex";
        } else {
          setStatus("check", `Application à jour (v${res.currentVersion})`);
        }
      } catch (err) {
        setStatus("alert", err.message || "Erreur de connexion");
      } finally {
        btnCheck.disabled = false;
        checkBtnIcon.innerHTML = ICONS.refresh;
        checkBtnLabel.textContent = "Vérifier";
      }
    }

    async function downloadUpdate() {
      if (!currentUpdateData || !currentUpdateData.downloadUrl) return;

      btnCheck.disabled = true;
      btnDownload.disabled = true;
      btnDownload.style.display = "none";
      progressContainer.classList.add("show");
      progressBarFill.style.width = "0%";
      progressPercent.textContent = "0%";
      progressText.textContent = "Téléchargement...";
      setStatus("info", `Téléchargement en cours...`);

      const unsubscribe = window.maiAbout.onDownloadProgress((data) => {
        const p = data.percent;
        progressBarFill.style.width = `${p}%`;
        progressPercent.textContent = `${p}%`;
        const recStr = formatBytes(data.received);
        const totStr = formatBytes(data.total);
        progressText.textContent = totStr ? `${recStr} / ${totStr}` : `${recStr}`;
      });

      try {
        const res = await window.maiAbout.downloadUpdate(
          currentUpdateData.downloadUrl,
          currentUpdateData.fileName
        );
        unsubscribe();

        if (res.success && res.filePath) {
          downloadedFilePath = res.filePath;
          progressBarFill.style.width = "100%";
          progressPercent.textContent = "100%";
          setStatus("check", "Téléchargement terminé");
          btnLaunch.style.display = "flex";
        } else {
          setStatus("alert", res.error || "Échec du téléchargement");
          btnDownload.disabled = false;
          btnDownload.style.display = "flex";
        }
      } catch (err) {
        unsubscribe();
        setStatus("alert", err.message || "Erreur réseau");
        btnDownload.disabled = false;
        btnDownload.style.display = "flex";
      } finally {
        btnCheck.disabled = false;
      }
    }

    btnCheck.addEventListener("click", checkUpdates);
    btnDownload.addEventListener("click", downloadUpdate);
    btnLaunch.addEventListener("click", () => {
      if (downloadedFilePath) {
        window.maiAbout.openInstaller(downloadedFilePath);
      }
    });

    linkSite.addEventListener("click", () => {
      window.maiAbout.openExternal("https://mai-officiel.vercel.app");
    });
    linkGithub.addEventListener("click", () => {
      window.maiAbout.openExternal("https://github.com/mDevsLabs/Web/releases");
    });

    init();
  </script>
</body>
</html>
