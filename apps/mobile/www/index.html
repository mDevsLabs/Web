<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8">
    <meta
      content="width=device-width, initial-scale=1, viewport-fit=cover"
      name="viewport"
    >
    <title>mAI</title>
    <style>
    * {
      box-sizing: border-box;
      padding: 0;
      margin: 0;
    }
    html,
    body {
      height: 100%;
      overflow: hidden;
      background: #0a0a0a;
    }
    /* Fallback Web : si lancé hors Capacitor, affiche iframe plein écran */
    #app {
      display: block;
      width: 100vw;
      height: 100vh;
      background: #0a0a0a;
      border: 0;
    }
    .loader {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      gap: 16px;
      align-items: center;
      justify-content: center;
      font-family: system-ui, sans-serif;
      color: #fff;
      background: #0a0a0a;
    }
    .loader img {
      width: 96px;
      height: 96px;
      border-radius: 22px;
    }
    .loader p {
      font-size: 14px;
      opacity: 0.6;
    }
    </style>
  </head>
  <body>
    <div class="loader" id="loader">
      <img alt="mAI" onerror="this.style.display='none'" src="./icon.png">
      <p>Chargement de mAI…</p>
    </div>
    <iframe
      allow="
        clipboard-read;
        clipboard-write;
        fullscreen;
        geolocation;
        camera;
        microphone;
      "
      id="app"
      sandbox="allow-same-origin allow-scripts allow-forms allow-popups allow-popups-to-escape-sandbox"
      src="https://mai-officiel.vercel.app"
      title="mAI"
    ></iframe>
    <script>
    "use strict";
    // Hors Capacitor, on cache le loader quand l'iframe charge
    const iframe = document.getElementById("app");
    const loader = document.getElementById("loader");
    iframe.addEventListener("load", () => (loader.style.display = "none"));
    iframe.addEventListener(
      "error",
      () =>
        (loader.innerHTML =
          "<p>Impossible de charger mAI. Vérifiez votre connexion.</p>")
    );
    // Détection Capacitor : si présent, il chargera server.url directement et cette page ne sera pas utilisée
    if (window.Capacitor) {
      // Capacitor natif : les plugins sont dispos, on peut masquer la WebView fallback
      loader.innerHTML = "<p>Ouverture de mAI…</p>";
    }
    // Timeout fallback
    setTimeout(() => {
      if (loader) {
        loader.style.display = "none";
      }
    }, 8000);
    </script>
  </body>
</html>
