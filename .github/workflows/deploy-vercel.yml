name: 🚀 Deploy to Vercel

# Séparation stricte des environnements.
#
# AVANT : un seul job, déclenché sur TOUTE branche et TOUTE pull request,
# exécutait `pnpm exec tsx lib/db/migrate.ts` avec le même secret
# `DATABASE_URL` que la production. Une branche de prévisualisation (ou une PR
# d'un contributeur) migrait donc — et réparait le schéma de — la base de
# production, sans approbation.
#
# MAINTENANT :
#  • la base migrée est TOUJOURS celle du `vercel pull` de l'environnement
#    déployé (fichier .env.vercel) : divergence secret GitHub / dashboard
#    impossible par construction. Le bug « migrations appliquées côté CI sur
#    une base, runtime Vercel branché sur une autre » ne peut plus se produire
#    silencieusement — la garde compare les empreintes et bloque sinon ;
#  • `preview` : build + déploiement de prévisualisation. Un push sur `main`
#    ou `canary` migre et vérifie le schéma AVANT le build (PR de forks :
#    jamais de migration, jamais d'accès base) ;
#  • `production` : réservé à la branche `main`, rattaché à l'environnement
#    GitHub `production` (approbation requise), avec garde de schéma avant
#    et après migration.
on:
  push:
    branches: [main, canary]
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
  VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
  # Outil épinglé : `vercel@latest` rendait les déploiements non reproductibles
  # (une nouvelle version pouvait changer le comportement sans changement de code).
  VERCEL_CLI_VERSION: "59.23.2"

jobs:
  preview:
    name: Prévisualisation (migrations sur branches suivies)
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: 📦 Checkout du code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: ⚡ Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: 🛠️ Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: 🔑 Vérifier les secrets Vercel
        run: |
          if [ -z "${{ env.VERCEL_TOKEN }}" ]; then
            echo "::error::Le secret VERCEL_TOKEN est manquant dans les paramètres GitHub !"
            exit 1
          fi

      - name: ⚡ Installer la CLI Vercel (version épinglée)
        run: npm install --global vercel@${{ env.VERCEL_CLI_VERSION }}

      - name: 📥 Installation des dépendances
        run: pnpm install --frozen-lockfile

      # L'environnement preview du dashboard est la SOURCE DE VÉRITÉ : c'est
      # exactement ce que le déploiement utilisera à l'exécution.
      - name: 🌍 Récupérer l'environnement de prévisualisation
        run: vercel pull --yes --environment=preview --token=${{ env.VERCEL_TOKEN }}

      - name: 🔎 Révéler la base runtime (empreinte, sans secret)
        run: node scripts/print-db-target.mjs .env.vercel

      # Les pushes sur main/canary migrent la base du DASHBOARD (celle du
      # déploiement) : un éventuel secret GitHub divergent n'est plus suivi.
      - name: 🗄️ Migration de la base du déploiement (main/canary uniquement)
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/canary')
        run: pnpm exec tsx lib/db/migrate.ts
        env:
          DATABASE_URL_FILE: .env.vercel
          POSTGRES_URL_FILE: .env.vercel
          MIGRATIONS_STRICT: "true"

      # Garde bloquante sur la MÊME base que le déploiement : un schéma obsolète
      # n'est plus déployé (il répondrait 500 sur chaque conversation).
      - name: 🛡️ Garde de schéma avant déploiement
        run: node scripts/check-db-schema.mjs .env.vercel
        env:
          DATABASE_URL: ""
          POSTGRES_URL: ""

      - name: 🏗️ Build des artefacts
        run: vercel build --token=${{ env.VERCEL_TOKEN }}

      - name: 🌐 Déployer la prévisualisation
        run: vercel deploy --prebuilt --archive=tgz --token=${{ env.VERCEL_TOKEN }}

  production:
    name: Production (migrations approuvées)
    # Seule la branche `main` peut migrer et déployer en production. Le job est
    # rattaché à l'environnement GitHub `production` : les règles de protection
    # de cet environnement (reviewers obligatoires) s'appliquent avant toute
    # exécution, migrations incluses.
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    environment: production
    runs-on: ubuntu-latest
    steps:
      - name: 📦 Checkout du code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: ⚡ Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: 🛠️ Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: ⚡ Installer la CLI Vercel (version épinglée)
        run: npm install --global vercel@${{ env.VERCEL_CLI_VERSION }}

      - name: 📥 Installation des dépendances
        run: pnpm install --frozen-lockfile

      - name: 🌍 Récupérer l'environnement de production
        run: vercel pull --yes --environment=production --token=${{ env.VERCEL_TOKEN }}

      - name: 🔎 Révéler la base runtime (empreinte, sans secret)
        run: node scripts/print-db-target.mjs .env.vercel

      # État AVANT migration : la garde échoue explicitement si la base est
      # plus vieille que le code (tables critiques absentes), avec le rappel
      # de la commande à exécuter.
      - name: 🛡️ Garde de schéma (avant migration)
        run: |
          node scripts/check-db-schema.mjs .env.vercel \
            || echo "::warning::Schéma en dérive avant migration : la migration qui suit doit la résoudre."
        env:
          DATABASE_URL: ""
          POSTGRES_URL: ""
        continue-on-error: true

      # Migration PUIS build, sur la base du DASHBOARD. `MIGRATIONS_STRICT=true` :
      # une étape de réparation en échec inattendu fait échouer le job.
      - name: 🗄️ Migration puis build des artefacts
        run: pnpm exec tsx lib/db/migrate.ts && vercel build --prod --token=${{ env.VERCEL_TOKEN }}
        env:
          DATABASE_URL_FILE: .env.vercel
          POSTGRES_URL_FILE: .env.vercel
          MIGRATIONS_STRICT: "true"

      # Vérification dure APRÈS migration : si une table critique manque
      # encore, le déploiement est bloqué (il répondrait 500 partout).
      - name: 🛡️ Garde de schéma (après migration, bloquante)
        run: node scripts/check-db-schema.mjs .env.vercel
        env:
          DATABASE_URL: ""
          POSTGRES_URL: ""

      - name: 🌐 Déployer en production
        run: vercel deploy --prebuilt --archive=tgz --prod --token=${{ env.VERCEL_TOKEN }}
