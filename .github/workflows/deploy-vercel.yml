name: 🚀 Deploy to Vercel

on:
  push:
    branches:
      - main
      - canary
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
  VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
  DATABASE_URL: ${{ secrets.DATABASE_URL }}
  KEY_VAULTS_SECRET: ${{ secrets.KEY_VAULTS_SECRET }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: 📦 Checkout du code
        uses: actions/checkout@v4

      - name: 🛠️ Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: 🛠️ Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: 🛠️ Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 🔑 Vérifier les secrets Vercel
        run: |
          if [ -z "${{ env.VERCEL_TOKEN }}" ]; then
            echo "::error::Le secret VERCEL_TOKEN est manquant dans les paramètres GitHub !"
            exit 1
          fi
          if [ -z "${{ env.VERCEL_ORG_ID }}" ]; then
            echo "::error::La variable VERCEL_ORG_ID est manquante !"
            exit 1
          fi
          if [ -z "${{ env.VERCEL_PROJECT_ID }}" ]; then
            echo "::error::La variable VERCEL_PROJECT_ID est manquante !"
            exit 1
          fi

      - name: ⚡ Install Vercel CLI
        run: pnpm install --global vercel@latest

      - name: 📥 Installation des dépendances
        run: pnpm install

      - name: 🌍 Pull Vercel Environment Information
        run: |
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            vercel pull --yes --environment=production --token=${{ env.VERCEL_TOKEN }}
          else
            vercel pull --yes --environment=preview --token=${{ env.VERCEL_TOKEN }}
          fi

      - name: 🗄️ Run Database Migration
        run: bun run db:migrate

      - name: 🏗️ Build Project Artifacts
        run: |
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            vercel build --prod --token=${{ env.VERCEL_TOKEN }}
          else
            vercel build --token=${{ env.VERCEL_TOKEN }}
          fi

      - name: 🌐 Deploy Project Artifacts to Vercel
        run: |
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            vercel deploy --prebuilt --prod --archive=tgz --token=${{ env.VERCEL_TOKEN }}
          else
            vercel deploy --prebuilt --archive=tgz --token=${{ env.VERCEL_TOKEN }}
          fi