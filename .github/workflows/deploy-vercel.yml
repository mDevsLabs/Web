name: 🚀 Deploy to Vercel

on:
  push:
    branches:
      - '**'
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
  VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: 📦 Checkout du code
        uses: actions/checkout@v4

      - name: ⚡ Setup pnpm
        uses: pnpm/action-setup@v4

      - name: 🛠️ Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: 🔑 Vérifier les secrets Vercel
        run: |
          if [ -z "${{ env.VERCEL_TOKEN }}" ]; then
            echo "::error::Le secret VERCEL_TOKEN est manquant dans les paramètres GitHub !"
            exit 1
          fi
          if [ -z "${{ env.VERCEL_ORG_ID }}" ]; then
            echo "::error::La variable VERCEL_ORG_ID est manquante !"
            exit 1
          fi
          if [ -z "${{ env.VERCEL_PROJECT_ID }}" ]; then
            echo "::error::La variable VERCEL_PROJECT_ID est manquante !"
            exit 1
          fi

      - name: ⚡ Install Vercel CLI
        run: npm install --global vercel@latest

      - name: 📥 Installation des dépendances
        run: pnpm install --frozen-lockfile

      # Le typecheck n'appartient plus au déploiement : `pnpm typecheck`
      # (tsc --noEmit) reste disponible en local/CI et est exécuté lors de la
      # validation finale du travail de développement.

      - name: 🌍 Pull Vercel Environment Information
        run: |
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            vercel pull --yes --environment=production --token=${{ env.VERCEL_TOKEN }}
          else
            vercel pull --yes --environment=preview --token=${{ env.VERCEL_TOKEN }}
          fi

      # Étape unique : migration PUIS build Vercel (environnement récupéré au
      # pull ci-dessus). Le && stoppe immédiatement le build si la migration
      # échoue. DATABASE_URL / POSTGRES_URL ne sont exposés que sur cette
      # étape, qui est la seule à en avoir besoin.
      - name: 🗄️ Migration puis Build Project Artifacts
        run: |
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            pnpm exec tsx lib/db/migrate.ts && vercel build --prod --token=${{ env.VERCEL_TOKEN }}
          else
            pnpm exec tsx lib/db/migrate.ts && vercel build --token=${{ env.VERCEL_TOKEN }}
          fi
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          POSTGRES_URL: ${{ secrets.DATABASE_URL }}

      - name: 🌐 Deploy Project Artifacts to Vercel
        run: |
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            vercel deploy --prebuilt --archive=tgz --prod --token=${{ env.VERCEL_TOKEN }}
          else
            vercel deploy --prebuilt --archive=tgz --token=${{ env.VERCEL_TOKEN }}
          fi
