name: "CRON Vibe (Publications & Messages Directs Vibe)"

on:
  workflow_dispatch:
    inputs:
      reason:
        description: "Motif de l'exécution manuelle"
        required: false
        default: "Déclenchement manuel opérateur"
        type: string

concurrency:
  group: cron-vibe
  cancel-in-progress: false

jobs:
  run-vibe-tick:
    name: "Tick Vibe"
    runs-on: ubuntu-latest
    timeout-minutes: 3

    steps:
      - name: "Récupération du code"
        uses: actions/checkout@v4

      - name: "Configuration de Node.js"
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: "Exécution du tick Vibe"
        run: node scripts/cron/run-tick.mjs vibe
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
