name: "CRON Agent (Scheduler Autonome)"

on:
  workflow_dispatch:
    inputs:
      reason:
        description: "Motif de l'exécution manuelle"
        required: false
        default: "Déclenchement manuel opérateur"
        type: string

concurrency:
  group: cron-agent
  cancel-in-progress: false

jobs:
  run-agent-tick:
    name: "Tick Agent"
    runs-on: ubuntu-latest
    timeout-minutes: 6

    steps:
      - name: "Récupération du code"
        uses: actions/checkout@v4

      - name: "Configuration de Node.js"
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: "Exécution du tick Agent"
        run: node scripts/cron/run-tick.mjs agent
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
