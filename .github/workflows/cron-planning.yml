name: "CRON Planning (Messages & Actions Planifiés)"

on:
  workflow_dispatch:
    inputs:
      reason:
        description: "Motif de l'exécution manuelle"
        required: false
        default: "Déclenchement manuel opérateur"
        type: string

concurrency:
  group: cron-planning
  cancel-in-progress: false

jobs:
  run-planning-tick:
    name: "Tick Planning"
    runs-on: ubuntu-latest
    timeout-minutes: 6

    steps:
      - name: "Récupération du code"
        uses: actions/checkout@v4

      - name: "Configuration de Node.js"
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: "Exécution du tick Planning"
        run: node scripts/cron/run-tick.mjs planning
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
