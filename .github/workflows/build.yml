name: Build et déploiements
on:
  push:
    branches:
      - "**"
    tags:
      - v*
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
  workflow_dispatch:
    inputs:
      build_ios:
        description: Build iOS (IPA) aussi - nécessite un runner macOS
        type: boolean
        default: true
permissions:
  contents: read
  pull-requests: read
env:
  CSC_IDENTITY_AUTO_DISCOVERY: "false"
jobs:
  version:
    name: Vérifier la version à publier
    runs-on: ubuntu-latest
    steps:
      - name: Checkout du code
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Vérifier la nouvelle version stable
        if: github.event_name!= 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('node:fs');
            const version = JSON.parse(fs.readFileSync('package.json', 'utf8')).version;
            const tag = 'stable.' + version;
            try {
              await github.rest.git.getRef({...context.repo, ref: 'tags/' + tag });
            } catch (error) {
              if (error.status === 404) return;
              throw error;
            }
            core.setFailed('La release ' + tag + ' existe déjà. Augmentez package.json avant un nouveau build sur main.');
  changes:
    needs: [version]
    name: Filtrer les chemins modifiés
    runs-on: ubuntu-latest
    # Tous les builds d'applications tournent à CHAQUE commit: un changement
    # partagé (packages/ui, icônes, contrat d'API) casse une application même
    # quand son dossier n'a pas bougé, et le filtre par chemins laissait passer
    # ces régressions. Le filtre reste exécuté pour l'information, mais ne
    # conditionne plus les jobs.
    outputs:
      vibe: true
      mobile: true
      desktop: true
      coder: true
      blackline: true
    steps:
      - name: Checkout du code
        if: ${{ github.event_name == 'pull_request' || (github.event_name == 'push' &&!startsWith(github.ref,
          'refs/tags/')) }}
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Détecter les applications modifiées
        id: filter
        if: ${{ github.event_name == 'pull_request' || (github.event_name == 'push' &&!startsWith(github.ref,
          'refs/tags/')) }}
        uses: dorny/paths-filter@v4
        with:
          base: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.ref || github.event.before }}
          filters: |-
            vibe:
              - "apps/vibe/**"
              - "packages/ui/**"
              - "packages/icons/**"
              - ".github/workflows/build.yml"
              - "package.json"
            desktop:
              - "apps/desktop/**"
              - "apps/coder/**"
              - "packages/ui/**"
              - "packages/icons/**"
              - "public/logo.png"
              - ".github/workflows/build.yml"
              - "package.json"
            mobile:
              - "apps/mobile/**"
              - "public/logo.png"
              - ".github/workflows/build.yml"
            coder:
              - "apps/coder/**"
              - "packages/ui/**"
              - "packages/icons/**"
              - ".github/workflows/build.yml"
              - "package.json"
            blackline:
              - "apps/blackline/**"
              - "components/blackline/**"
              - "lib/blackline/**"
              - "app/(chat)/blackline/**"
              - "app/(chat)/api/blackline/**"
              - "scripts/build-blackline.mjs"
              - "scripts/build-blackline-css.mjs"
              - ".github/workflows/build.yml"
              - "package.json"

  deploy-vercel:
    needs: [version]
    name: Déploiement Vercel
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && (github.ref ==
      'refs/heads/main' || github.ref == 'refs/heads/canary')) || (github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository) }}
    environment:
      name: ${{ github.event_name!= 'pull_request' && github.ref == 'refs/heads/main' && 'production' || 'preview'
        }}
    runs-on: ubuntu-latest
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_CLI_VERSION: 64.5.0
      DEPLOY_TARGET: ${{ github.event_name!= 'pull_request' && github.ref == 'refs/heads/main' && 'production' ||
        'preview' }}
    steps:
      - name: Checkout du code
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Vérifier le secret Vercel
        run: |-
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "::error::Le secret VERCEL_TOKEN est manquant dans les parametres GitHub."
            exit 1
          fi
      - name: Installer le CLI Vercel
        run: npm install --global "vercel@$VERCEL_CLI_VERSION"
      - name: Installer les dépendances
        run: pnpm install --frozen-lockfile
      # Blackline est un jeu Vite AUTONOME: il n'est pas membre du workspace
      # pnpm (pnpm-workspace.yaml liste `packages: []`), il a son propre
      # package-lock.json et ses propres node_modules. `pnpm build` lance
      # `scripts/build-blackline.mjs`, qui exige ces dépendances.
      - name: Installer les dépendances de Blackline
        run: npm ci --prefix apps/blackline
      - name: Récupérer l'environnement Vercel
        run: vercel pull --yes --environment="$DEPLOY_TARGET" --token="$VERCEL_TOKEN"
      - name: Afficher l'empreinte de la base migrée
        run: node scripts/print-db-target.mjs
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
      - name: Migrer la base de données
        run: |-
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            echo "::warning::Migration appliquee depuis une pull_request sur la base Preview partagee."
          fi
          pnpm exec tsx lib/db/migrate.ts
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          POSTGRES_URL: ${{ secrets.DATABASE_URL }}
          MIGRATIONS_STRICT: "true"
      - name: Garde de schéma après migration
        id: guard
        run: node scripts/check-db-schema.mjs
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
      - name: Construire les artefacts Vercel
        run: |-
          if [ "$DEPLOY_TARGET" = "production" ]; then
            vercel build --prod --token="$VERCEL_TOKEN"
          else
            vercel build --token="$VERCEL_TOKEN"
          fi
      - name: Déployer sur Vercel
        run: |-
          if [ "$DEPLOY_TARGET" = "production" ]; then
            vercel deploy --prebuilt --archive=tgz --prod --token="$VERCEL_TOKEN"
          else
            vercel deploy --prebuilt --archive=tgz --token="$VERCEL_TOKEN"
          fi
  desktop:
    name: Desktop ${{ matrix.os }} – ${{ matrix.arch }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            arch: x64
            target: linux
          - os: macos-latest
            arch: x64 et arm64
            target: mac
          - os: windows-latest
            arch: x64
            target: win
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install Linux deps
        if: matrix.target == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libarchive-tools rpm fakeroot build-essential python3
      - name: Python pour les dépendances natives Windows
        if: matrix.target == 'win'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compilateur natif Windows
        if: matrix.target == 'win'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: Install desktop deps
        working-directory: apps/desktop
        run: pnpm install --frozen-lockfile
      - name: Installer les dépendances Coder
        working-directory: apps/coder
        run: pnpm install --frozen-lockfile
      - name: Préparer Coder pour le paquet bureau
        working-directory: apps/desktop
        run: pnpm run prepare:coder x64
      - name: Préparer Coder ARM64 sur macOS
        if: matrix.target == 'mac'
        working-directory: apps/desktop
        run: pnpm run prepare:coder arm64
      - name: Générer icônes (logo → ico/icns/png)
        working-directory: apps/desktop
        run: node scripts/generate-icons.mjs
      - name: Build – TypeScript
        working-directory: apps/desktop
        run: pnpm run build
      - name: Build – Linux
        if: matrix.target == 'linux'
        working-directory: apps/desktop
        run: pnpm exec electron-builder --linux --x64 --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Build – macOS (non signé)
        if: matrix.target == 'mac'
        working-directory: apps/desktop
        run: pnpm exec electron-builder --mac --x64 --arm64 --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - name: Build – Windows (non signé)
        if: matrix.target == 'win'
        working-directory: apps/desktop
        run: pnpm exec electron-builder --win --x64 --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - name: Upload artefact – Linux
        if: matrix.target == 'linux'
        uses: actions/upload-artifact@v4
        with:
          name: mai-desktop-linux-x64
          path: |
            apps/desktop/dist-elec/*.AppImage
            apps/desktop/dist-elec/*.deb
            apps/desktop/dist-elec/*.rpm
            apps/desktop/dist-elec/*.snap
          if-no-files-found: error
      - name: Upload artefact – macOS
        if: matrix.target == 'mac'
        uses: actions/upload-artifact@v4
        with:
          name: mai-desktop-macos
          path: |
            apps/desktop/dist-elec/*.dmg
            apps/desktop/dist-elec/*.zip
          if-no-files-found: error
      - name: Upload artefact – Windows
        if: matrix.target == 'win'
        uses: actions/upload-artifact@v4
        with:
          name: mai-desktop-windows-x64
          path: |
            apps/desktop/dist-elec/*.exe
            apps/desktop/dist-elec/*.msi
          if-no-files-found: error
    needs:
      - changes
      - coder-check
    if: needs.changes.outputs.desktop == 'true'
  mobile-android:
    name: Mobile Android (APK de développement)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/mobile/pnpm-lock.yaml
      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Accepter licences Android SDK
        run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses < <(yes)'
      - name: Install mobile deps
        working-directory: apps/mobile
        run: pnpm install --frozen-lockfile --ignore-workspace
      - name: Générer icônes mobiles (logo → resources/icon.png)
        working-directory: apps/mobile
        run: node scripts/generate-icons.mjs
      - name: Capacitor – add & sync android
        working-directory: apps/mobile
        run: |
          if [ ! -d "android" ]; then
            npx --package=@capacitor/cli cap add android
          fi
          npx --package=@capacitor/cli cap sync android
      - name: Patch icônes natives Android (logo → mipmap)
        working-directory: apps/mobile
        run: node scripts/generate-icons.mjs
      - name: Build Android – Debug APK (debug keystore, non production)
        working-directory: apps/mobile/android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace
      - name: Upload APK – Debug
        uses: actions/upload-artifact@v4
        with:
          name: mai-mobile-android-debug
          path: |
            apps/mobile/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
    needs:
      - changes
    if: needs.changes.outputs.mobile == 'true'
  mobile-ios:
    name: Mobile iOS (IPA non signé)
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/mobile/pnpm-lock.yaml
      - name: Install mobile deps
        working-directory: apps/mobile
        run: pnpm install --frozen-lockfile --ignore-workspace
      - name: Générer icônes mobiles
        working-directory: apps/mobile
        run: node scripts/generate-icons.mjs
      - name: Capacitor – add & sync ios
        working-directory: apps/mobile
        run: |
          if [ ! -d "ios" ]; then
            npx --package=@capacitor/cli cap add ios
          fi
          npx --package=@capacitor/cli cap sync ios
      - name: Patch icônes natives iOS (logo → AppIcon)
        working-directory: apps/mobile
        run: node scripts/generate-icons.mjs
      - name: Construire l’archive iOS non signée
        working-directory: apps/mobile
        run: |
          if [ -d "ios/App/App.xcworkspace" ]; then
            TARGET="-workspace ios/App/App.xcworkspace"
          elif [ -d "ios/App/App.xcodeproj" ]; then
            TARGET="-project ios/App/App.xcodeproj"
          elif [ -f "ios/App/Podfile" ]; then
            (cd ios/App && pod install)
            TARGET="-workspace ios/App/App.xcworkspace"
          else
            echo "::error::Aucun projet ou workspace Xcode trouvé dans apps/mobile/ios/App"
            exit 1
          fi

          xcodebuild archive \
            $TARGET \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath ios/App/build/App.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_INJECT_BASE_ENTITLEMENTS=NO
      - name: Créer l’IPA à partir de l’archive réelle
        working-directory: apps/mobile
        run: |
          rm -rf ios/App/build/Payload
          mkdir -p ios/App/build/Payload
          cp -R ios/App/build/App.xcarchive/Products/Applications/*.app ios/App/build/Payload/
          cd ios/App/build
          zip -r mAI-unsigned.ipa Payload
      - name: Upload IPA – unsigned
        uses: actions/upload-artifact@v4
        with:
          name: mai-mobile-ios-unsigned
          path: |
            apps/mobile/ios/App/build/*.ipa
          if-no-files-found: error
    needs:
      - changes
    if: needs.changes.outputs.mobile == 'true' && (github.event_name!= 'workflow_dispatch' || inputs.build_ios)
  # La publication de la release est gérée par le job 'publish' en fin de workflow après toutes les validations de paquets et déploiements.

  # ─────────────────────────────────────────────────────────────────────────────
  # JOBS — Vibe mobile (application distincte chargeant le portage /vibe)
  # ─────────────────────────────────────────────────────────────────────────────
  build-android:
    name: Vibe Android (APK de développement)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/vibe
    steps:
      - name: Checkout du code
        uses: actions/checkout@v4
      - name: Configuration de Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/vibe/package-lock.json
      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Accepter les licences Android SDK
        run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses < <(yes)'
      - name: Installer les dépendances
        run: npm ci
      - name: Compiler l'application web
        run: npm run build
        env:
          VITE_API_BASE: https://mai.val.run
      - name: Ajouter les plateformes Capacitor
        run: |
          npm install --no-save --package-lock=false @capacitor/cli@8 @capacitor/core@8 @capacitor/android@8
          if [ ! -d "android" ]; then
            npx --package=@capacitor/cli cap add android
          fi
          npx --package=@capacitor/cli cap sync android
      - name: Rendre gradlew exécutable
        run: chmod +x android/gradlew
      - name: Compiler l'APK Android de développement
        run: cd android && ./gradlew assembleDebug --no-daemon --stacktrace
      - name: Uploader l'artefact APK
        uses: actions/upload-artifact@v4
        with:
          name: vibe-android-apk
          path: apps/vibe/android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
    needs:
      - changes
    if: needs.changes.outputs.vibe == 'true'
  build-ios:
    name: Vibe iOS (IPA non signé)
    runs-on: macos-latest
    if: ${{ needs.changes.outputs.vibe == 'true' && ((github.event_name == 'workflow_dispatch' &&
      inputs.build_ios) || github.event_name == 'push' || github.event_name == 'pull_request') }}
    defaults:
      run:
        working-directory: apps/vibe
    steps:
      - name: Checkout du code
        uses: actions/checkout@v4
      - name: Configuration de Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/vibe/package-lock.json
      - name: Installer les dépendances
        run: npm ci
      - name: Compiler l'application web
        run: npm run build
        env:
          VITE_API_BASE: https://mai.val.run
      - name: Ajouter la plateforme Capacitor iOS
        run: |
          npm install --no-save --package-lock=false @capacitor/cli@8 @capacitor/core@8 @capacitor/ios@8
          if [ ! -d "ios" ]; then
            npx --package=@capacitor/cli cap add ios
          fi
          npx --package=@capacitor/cli cap sync ios
      - name: Compiler l'archive (non signé sans secrets Apple)
        run: |
          if [ -d "ios/App/App.xcworkspace" ]; then
            TARGET="-workspace ios/App/App.xcworkspace"
          elif [ -d "ios/App/App.xcodeproj" ]; then
            TARGET="-project ios/App/App.xcodeproj"
          elif [ -f "ios/App/Podfile" ]; then
            (cd ios/App && pod install)
            TARGET="-workspace ios/App/App.xcworkspace"
          else
            echo "::error::Aucun projet ou workspace Xcode trouvé dans apps/vibe/ios/App"
            exit 1
          fi

          xcodebuild archive \
            $TARGET \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath ios/App/build/App.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_INJECT_BASE_ENTITLEMENTS=NO
      - name: Exporter l'IPA non signé
        run: |
          rm -rf Payload vibe-ios-unsigned.ipa
          mkdir -p Payload
          cp -R ios/App/build/App.xcarchive/Products/Applications/*.app Payload/
          zip -r vibe-ios-unsigned.ipa Payload
      - name: Uploader l'artefact IPA
        uses: actions/upload-artifact@v4
        with:
          name: vibe-ios-ipa
          path: apps/vibe/vibe-ios-unsigned.ipa
          if-no-files-found: error
    needs:
      - changes

  # Coder est validé avant ses installateurs autonomes et le paquet desktop.
  coder-check:
    name: Coder – Types et build
    runs-on: ubuntu-latest
    needs: [changes]
    if: needs.changes.outputs.coder == 'true' || needs.changes.outputs.desktop == 'true'
    timeout-minutes: 30
    defaults:
      run:
        working-directory: apps/coder
    steps:
      - name: Checkout du code
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/coder/pnpm-lock.yaml
      - name: Installer les dépendances
        run: pnpm install --frozen-lockfile
      - name: Compiler le Main (esbuild)
        run: pnpm run build:main
      - name: Compiler le Renderer (Vite)
        run: pnpm run build:renderer

  coder-windows:
    name: Coder Windows (NSIS / MSI)
    runs-on: windows-2022
    needs: [changes, coder-check]
    if: needs.changes.outputs.coder == 'true'
    defaults:
      run:
        working-directory: apps/coder
    env:
      ASYNC_BUILTIN_TEAM_SOURCE: ${{ github.workspace }}/agency-agents
      GYP_MSVS_VERSION: "2022"
      npm_config_msvs_version: "2022"
      npm_config_python: "python"
      NODE_VERSION: 22
    steps:
      - name: Checkout du code
        uses: actions/checkout@v4
      - name: Checkout du dépôt builtin team
        uses: actions/checkout@v4
        continue-on-error: true
        with:
          repository: msitarzewski/agency-agents
          path: agency-agents
          fetch-depth: 1
      - name: Configuration de Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Configuration de pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false
      - name: Configuration de Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/coder/pnpm-lock.yaml
      - name: Configuration de l'environnement MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: Installer les dépendances
        shell: pwsh
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Compiler les installateurs Windows
        run: pnpm run release:win
      - name: Uploader les artefacts de release Windows
        uses: actions/upload-artifact@v4
        with:
          name: release-coder-windows
          path: |
            apps/coder/release/*.exe
            apps/coder/release/*.msi
            apps/coder/release/*.blockmap
            apps/coder/release/latest*.yml
          if-no-files-found: error

  coder-macos:
    name: Coder macOS (DMG / ZIP non signé)
    runs-on: macos-latest
    needs: [changes, coder-check]
    if: needs.changes.outputs.coder == 'true'
    defaults:
      run:
        working-directory: apps/coder
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
      ASYNC_BUILTIN_TEAM_SOURCE: ${{ github.workspace }}/agency-agents
    steps:
      - name: Checkout du code
        uses: actions/checkout@v4
      - name: Checkout du dépôt builtin team
        uses: actions/checkout@v4
        continue-on-error: true
        with:
          repository: msitarzewski/agency-agents
          path: agency-agents
          fetch-depth: 1
      - name: Configuration de pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false
      - name: Configuration de Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/coder/pnpm-lock.yaml
      - name: Installer les dépendances
        run: pnpm install --frozen-lockfile
      - name: Compiler les paquets macOS (non signés)
        run: pnpm run release:mac:unsigned
      - name: Uploader les artefacts de release macOS
        uses: actions/upload-artifact@v4
        with:
          name: release-coder-macos
          path: |
            apps/coder/release/*.dmg
            apps/coder/release/*.zip
            apps/coder/release/*.blockmap
            apps/coder/release/latest*.yml
          if-no-files-found: error

  coder-linux:
    name: Coder Linux (AppImage / DEB)
    runs-on: ubuntu-latest
    needs: [changes, coder-check]
    if: needs.changes.outputs.coder == 'true'
    defaults:
      run:
        working-directory: apps/coder
    env:
      ASYNC_BUILTIN_TEAM_SOURCE: ${{ github.workspace }}/agency-agents
    steps:
      - name: Checkout du code
        uses: actions/checkout@v4
      - name: Checkout du dépôt builtin team
        uses: actions/checkout@v4
        continue-on-error: true
        with:
          repository: msitarzewski/agency-agents
          path: agency-agents
          fetch-depth: 1
      - name: Installer les outils système de build
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libasound2-dev libarchive-tools fakeroot
      - name: Configuration de pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false
      - name: Configuration de Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/coder/pnpm-lock.yaml
      - name: Installer les dépendances
        run: pnpm install --frozen-lockfile
      - name: Compiler les paquets Linux
        run: pnpm run release:linux
      - name: Uploader les artefacts de release Linux
        uses: actions/upload-artifact@v4
        with:
          name: release-coder-linux
          path: |
            apps/coder/release/*.AppImage
            apps/coder/release/*.deb
            apps/coder/release/*.blockmap
            apps/coder/release/latest*.yml
          if-no-files-found: error


  # ─────────────────────────────────────────────────────────────────────────────
  # JOB — Publication de la release (GitHub Releases)
  # Exécuté après validation complète de tous les builds de paquets et déploiements
  # ─────────────────────────────────────────────────────────────────────────────
  publish:
    name: Publication de la release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs:
      - deploy-vercel
      - desktop
      - mobile-android
      - mobile-ios
      - build-android
      - build-ios
      - coder-check
      - coder-windows
      - coder-macos
      - coder-linux
    if: |
      always() &&
      (github.event_name!= 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) &&
      !contains(needs.*.result, 'failure') &&
      !contains(needs.*.result, 'cancelled')
    permissions:
      contents: write
      actions: read
    steps:
      - name: Checkout du code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Configuration de Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Déterminer le tag et créer la release
        id: release
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('node:fs');
            const { nextReleaseTag, releaseChannel, releaseTitle, validateReleaseVersion } =
              await import(process.cwd() + '/scripts/release-version.mjs');

            const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
            const version = validateReleaseVersion(pkg.version);

            const isPr = context.eventName === 'pull_request';
            const headSha = isPr? context.payload.pull_request.head.sha: context.sha;
            const branch = isPr
              ? (context.payload.pull_request.head.ref || '')
              : context.ref.replace(/^refs\/heads\//, '').replace(/^refs\/tags\//, '');
            const channel = releaseChannel(context.eventName, branch);

            const marker = '<!-- mai-build:' + context.runId + ':' + context.runAttempt + ' -->';
            const releases = await github.paginate(github.rest.repos.listReleases, {...context.repo, per_page: 100 });
            const previous = releases.find(item => item.body?.includes(marker));

            let tag = previous?.tag_name;
            if (!tag) {
              if (context.ref.startsWith('refs/tags/')) {
                tag = context.ref.slice('refs/tags/'.length);
              } else {
                for (let attempt = 0; attempt < 20; attempt++) {
                  const refs = await github.paginate(github.rest.git.listMatchingRefs, {
                    ...context.repo, ref: 'tags/' + channel + '.' + version
                  });
                  tag = nextReleaseTag(version, channel, refs.map(item => item.ref.slice('refs/tags/'.length)));
                  try {
                    await github.rest.git.createRef({...context.repo, ref: 'refs/tags/' + tag, sha: headSha });
                    break;
                  } catch (error) {
                    if (![409, 422].includes(error.status)) throw error;
                    const { data: refsNow } = await github.rest.git.listMatchingRefs({
                      ...context.repo, ref: 'tags/' + tag
                    });
                    if (!refsNow.some(item => item.ref === 'refs/tags/' + tag)) throw error;
                    if (channel === 'stable') throw new Error('La version stable existe déjà: augmentez package.json.');
                    tag = undefined;
                  }
                }
              }
            }
            if (!tag) throw new Error('Impossible de réserver un numéro de release après 20 tentatives.');

            const { data: notes } = await github.rest.repos.generateReleaseNotes({
              ...context.repo, tag_name: tag, target_commitish: headSha
            });

            const title = releaseTitle(tag);
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const channelBadge = channel === 'stable'? ' Stable': channel === 'beta'? ' Bêta': ' Pull Request';

            const body = [
              marker,
              `## ${title}`,
              '',
              `Publication officielle de la version **${version}** (${channelBadge}).`,
              '',
              '### Notes de version & Nouveautés',
              notes.body || 'Aucune note de version spécifique fournie pour cette révision.',
              '',
              '---',
              '',
              '### Applications et Paquets inclus',
              'Les chemins modifiés déterminent les applications compilées. Les fichiers joints correspondent aux builds réussis de cette exécution:',
              '- **mAI Desktop**: Windows (`.exe`), macOS (`.dmg`, `.zip`), Linux (`.AppImage`, `.deb`, `.rpm`)',
              '- **mAI Coder**: Windows (`.exe`, `.msi`), macOS (`.dmg`, `.zip`), Linux (`.AppImage`, `.deb`)',
              '- **mAI Mobile**: Android (`.apk` de développement), iOS (`.ipa` non signé)',
              '- **Vibe**: Android (`.apk` de développement), iOS (`.ipa` non signé)',
              '- **Web**: Déploiement Vercel sur les branches et événements prévus par le workflow',
              '',
              '---',
              '',
              '### Traçabilité de la compilation',
              `- **Canal**: \`${channel}\``,
              `- **Version**: \`${version}\``,
              `- **Tag Git**: \`${tag}\``,
              `- **Commit**: \`${headSha}\``,
              `- **Exécution GitHub Actions**: [Voir le build #${context.runNumber}](${runUrl})`,
              '',
              'Les fichiers téléchargeables ci-dessous correspondent aux applications construites et validées durant ce workflow.'
            ].join('\n');

            const options = {
              ...context.repo,
              tag_name: tag,
              name: title,
              body,
              target_commitish: headSha,
              prerelease: channel!== 'stable',
              make_latest: channel === 'stable'? 'true': 'false'
            };

            const { data: release } = previous
              ? await github.rest.repos.updateRelease({...options, release_id: previous.id })
              : await github.rest.repos.createRelease(options);

            core.setOutput('id', release.id);
            core.setOutput('tag', tag);
            core.setOutput('url', release.html_url);
      - name: Télécharger tous les artefacts du build
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts
      - name: Joindre les fichiers construits à la release
        uses: actions/github-script@v7
        env:
          RELEASE_ID: ${{ steps.release.outputs.id }}
        with:
          script: |
            const fs = require('node:fs/promises');
            const path = require('node:path');
            const releaseId = Number(process.env.RELEASE_ID);
            const existing = await github.paginate(github.rest.repos.listReleaseAssets, {
              ...context.repo, release_id: releaseId, per_page: 100
            });
            const collected = [];
            async function collect(dir) {
              for (const entry of await fs.readdir(dir, { withFileTypes: true })) {
                const file = path.join(dir, entry.name);
                if (entry.isSymbolicLink()) continue;
                if (entry.isDirectory()) { await collect(file); continue; }
                if (!/\.(exe|msi|dmg|zip|deb|rpm|AppImage|snap|apk|ipa|aab|blockmap|yml)$/i.test(entry.name)) continue;
                // Le préfixe d'artefact évite les collisions entre applications.
                const relative = path.relative('release-artifacts', file);
                const name = relative.split(path.sep).join('-');
                collected.push({ base: entry.name, file, name });
              }
            }
            try { await fs.access('release-artifacts'); }
            catch { core.info('Cette exécution ne contient aucun artefact téléchargeable.'); return; }
            await collect('release-artifacts');
            const baseCounts = new Map();
            for (const item of collected) {
              baseCounts.set(item.base, (baseCounts.get(item.base) || 0) + 1);
            }
            const uploadNameByFile = new Map();
            for (const item of collected) {
              // Si le nom de base est unique, commence par mAI-Coder / mAI-,
              // ou est un fichier de métadonnées d'update, on conserve le nom de base canonique.
              // En cas de doublon (ex. app-debug.apk présent dans deux applications), on préfixe.
              const isUpdateMetadata = /^latest.*\.yml$/i.test(item.base);
              const isUnique = baseCounts.get(item.base) === 1;
              const isCoderOrDesktop = item.base.startsWith('mAI-Coder-') || item.base.startsWith('mAI-') || item.base.startsWith('mai-');
              const uploadName = (isUpdateMetadata || isUnique || isCoderOrDesktop)? item.base: item.name;
              uploadNameByFile.set(item.file, uploadName);
            }
            const uploadNameByBase = new Map(collected.map(c => [c.base, uploadNameByFile.get(c.file)]));
            for (const { base, file, name } of collected) {
              const isUpdateMetadata = /^latest.*\.yml$/i.test(base);
              const uploadName = uploadNameByFile.get(file);
              if (existing.some(asset => asset.name === uploadName)) continue;
              let data = await fs.readFile(file);
              if (isUpdateMetadata) {
                let text = data.toString('utf8');
                // Remplacer toutes les références au nom de base (dans 'path:', 'url:', 'file:', etc.)
                // par le nom réel sous lequel le binaire a été uploadé dans la release.
                // Cela évite qu'electron-updater ne télécharge une page 404 HTML exécutée
                // ensuite comme installateur (« Error launching installer»).
                for (const [baseName, targetName] of uploadNameByBase.entries()) {
                  if (baseName!== targetName) {
                    text = text.replaceAll(baseName, targetName);
                  }
                }
                data = Buffer.from(text, 'utf8');
              }
              console.log(`Upload de l'artefact: ${uploadName}`);
              await github.rest.repos.uploadReleaseAsset({
                ...context.repo, release_id: releaseId, name: uploadName,
                data,
                headers: { 'content-type': 'application/octet-stream' }
              });
            }


