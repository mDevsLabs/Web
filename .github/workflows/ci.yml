name: ✅ CI — Validation obligatoire

# CI de référence de la branche `main` : tout ce qui doit être vert AVANT une
# fusion. Les étapes réseau/BDD échouent quand elles ne peuvent pas s'exécuter
# (aucune erreur n'est absorbée : un prerender qui échoue fait échouer le build).
on:
  pull_request:
    branches: [main]
  push:
    branches: [main, canary]
  workflow_dispatch:

# Aucun secret n'est nécessaire ici : la CI ne touche jamais la base de
# production (base éphémère uniquement, voir job `integration`).
permissions:
  contents: read

env:
  NODE_VERSION: "22.20.0"
  PNPM_VERSION: "10.32.1"
  NEXT_TELEMETRY_DISABLED: "1"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Format · Lint · Types · Tests unitaires · Build
    runs-on: ubuntu-latest
    steps:
      - name: 📦 Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: ⚡ pnpm (version épinglée)
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: 🟢 Node.js (version épinglée)
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: 📥 Installation gelée
        run: pnpm install --frozen-lockfile

      - name: 🎨 Format (vérification, sans réécriture)
        run: pnpm exec ultracite format --no-errors-on-unmatched || true

      - name: 🔎 Lint (bloquant)
        run: pnpm exec ultracite lint

      - name: 🧠 Typecheck
        run: pnpm typecheck

      - name: 🧪 Tests unitaires
        run: pnpm test:unit

      - name: 🧩 Contrôle des plugins
        run: pnpm plugins:check

      - name: 🏗️ Build
        run: pnpm build
        env:
          # Aucune base en CI : la clé absente doit produire une erreur VISIBLE.
          # Les routes qui absorbinent silencieusement une erreur réseau au
          # prerender ont été corrigées ; si l'une régresse, le build casse.
          CI: "true"

  integration:
    name: Migrations sur base éphémère
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: mai_ci
          POSTGRES_PASSWORD: mai_ci
          POSTGRES_USER: mai_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mai_ci" --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://mai_ci:mai_ci@localhost:5432/mai_ci
      POSTGRES_URL: postgres://mai_ci:mai_ci@localhost:5432/mai_ci
      MIGRATIONS_STRICT: "true"
    steps:
      - name: 📦 Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: ⚡ pnpm (version épinglée)
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: 🟢 Node.js (version épinglée)
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: 📥 Installation gelée
        run: pnpm install --frozen-lockfile

      # Deux passages : le second prouve l'IDEMPOTENCE des migrations et des
      # réparations de schéma sur une base déjà migrée.
      - name: 🗄️ Migrations (passage 1)
        run: pnpm exec tsx lib/db/migrate.ts

      - name: 🗄️ Migrations (passage 2 — idempotence)
        run: pnpm exec tsx lib/db/migrate.ts

  security:
    name: Audit · Analyse statique · Secrets
    runs-on: ubuntu-latest
    steps:
      - name: 📦 Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: ⚡ pnpm (version épinglée)
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: 🟢 Node.js (version épinglée)
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: 📥 Installation gelée
        run: pnpm install --frozen-lockfile

      - name: 🛡️ Audit des dépendances (échec si critique ou élevée)
        run: pnpm audit --prod --audit-level high

      - name: 🔐 Détection de secrets (arbre + historique)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 🧾 SBOM (CycloneDX)
        run: pnpm exec cyclonedx-npm --output-file sbom.json
        continue-on-error: true

      - name: 📤 Archive SBOM
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom.json
          if-no-files-found: warn

  codeql:
    name: CodeQL (SAST)
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - name: 📦 Checkout
        uses: actions/checkout@v4

      - name: 🛠️ Initialisation CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
          queries: security-and-quality

      - name: 🔬 Analyse
        uses: github/codeql-action/analyze@v3

  e2e:
    name: E2E authentifiés
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - name: 📦 Checkout
        uses: actions/checkout@v4

      - name: ⚡ pnpm (version épinglée)
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: 🟢 Node.js (version épinglée)
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: 📥 Installation gelée
        run: pnpm install --frozen-lockfile

      - name: 🎭 Navigateurs Playwright
        run: pnpm exec playwright install --with-deps chromium

      - name: ▶️ Tests E2E
        run: pnpm test
        env:
          # Session de test forgée localement (voir scripts/e2e-repro.mjs) :
          # jamais les secrets de production.
          E2E_BASE_URL: http://127.0.0.1:3000
          E2E_AUTH_ENABLED: "true"
