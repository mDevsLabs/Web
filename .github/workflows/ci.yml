name: Quality checks

on:
  pull_request:
  push:
    branches: [main, canary]

permissions:
  contents: read

jobs:
  quality:
    name: Typecheck, lint, tests and build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      # Le lint global est reintroduit comme gate après réduction de la dette
      # existante ; typecheck/tests/build couvrent dès maintenant ce lot.
      - name: Unit tests
        run: pnpm test:unit

      - name: Plugin catalog
        run: pnpm plugins:check

      - name: Build
        run: pnpm build
