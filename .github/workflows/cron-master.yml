name: "CRON Master (Ordonnanceur Groupé)"

# Ordonnanceur PRINCIPAL des six ticks (agent, planning, wakies, vibe,
# notifications, quizzly), exécutés DIRECTEMENT sur le runner GitHub contre Neon
# et les fournisseurs IA : aucun appel à Vercel, donc zéro Active CPU Fluid
# consommé par les ticks (plan Hobby, quota de 4 h/mois).
#
# Même registre (`lib/cron/ticks.ts`) et même bail atomique (table Neon
# `cron_ticks`) que les deux filets restants côté Vercel :
#   - Vercel Cron (1 passage/jour) sur la route quotidienne `daily` ;
#   - ticks paresseux (cloche de notifications), seulement après 15 min de
#     retard, au cas où GitHub saute des passages.
# Aucune occurrence n'est exécutée deux fois.
#
# Dépôt public = journaux publics : le script masque URL de base, jetons,
# e-mails et identifiants (`lib/cron/log-mask.ts`). Aucun secret en argument.

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      tick:
        description: "Tick spécifique à exécuter"
        required: false
        default: "all"
        type: choice
        options:
          - all
          - agent
          - planning
          - wakies
          - vibe
          - notifications
          - quizzly

concurrency:
  group: cron-master
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  run-ticks:
    name: "Exécution des Ticks"
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - name: "Récupération du code"
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: "Installation de pnpm"
        uses: pnpm/action-setup@v4

      - name: "Configuration de Node.js"
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: "Installation des dépendances"
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: "Exécution directe des ticks"
        shell: bash
        env:
          NODE_ENV: production
          TICK: ${{ inputs.tick || 'all' }}
          # Requis
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          # Optionnels : mêmes valeurs que sur Vercel, si utilisés
          MAI_API_KEY: ${{ secrets.MAI_API_KEY }}
          MAI_API_URL: ${{ secrets.MAI_API_URL }}
          OPENROUTER_BASE_URL: ${{ secrets.OPENROUTER_BASE_URL }}
          COMET_API_KEY: ${{ secrets.COMET_API_KEY }}
          YOU_API_KEY: ${{ secrets.YOU_API_KEY }}
          MCP_ENCRYPTION_KEY: ${{ secrets.MCP_ENCRYPTION_KEY }}
          MCP_ENCRYPTION_KEY_ID: ${{ secrets.MCP_ENCRYPTION_KEY_ID }}
          MAI_JWT_SECRET: ${{ secrets.MAI_JWT_SECRET }}
          NEXT_PUBLIC_APP_URL: ${{ secrets.APP_URL }}
          PUBLIC_API_CONTACT_EMAIL: ${{ secrets.PUBLIC_API_CONTACT_EMAIL }}
        run: |
          set -euo pipefail
          args=()
          if [ "$TICK" != "all" ]; then
            args+=("--tick=$TICK")
          fi
          node --conditions=react-server --import tsx scripts/cron/run-direct.ts "${args[@]}"
