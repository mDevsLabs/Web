name: Audit Hebdomadaire des Dépendances

on:
  schedule:
    # Tous les lundis à 04h00 UTC
    - cron: "0 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  weekly-deps-audit:
    name: Audit hebdomadaire de sécurité & dépendances
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout du code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Installer les dépendances
        run: pnpm install --frozen-lockfile

      - name: Audit de sécurité des paquets
        run: pnpm audit --audit-level=high

      - name: Rapport d'obsolescence des dépendances
        run: pnpm outdated || true
